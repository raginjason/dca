name: dev-tools

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".claude/hooks/**"
      - ".github/workflows/dev-tools.yml"

jobs:
  install:
    # Same OS as the devcontainer base image and Claude cloud (doc/adr/0004).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: sudo .devcontainer/dev-tools/install.sh
      - name: Verify versions match versions.env and the devcontainer OS
        run: .devcontainer/dev-tools/install.sh --check
      - name: Verify every setup host is listed in hosts.txt
        run: .devcontainer/dev-tools/check-hosts-listed.sh
      - name: Verify the listed hosts are reachable
        run: .devcontainer/dev-tools/install.sh --preflight
      - name: Lint scripts
        run: |
          scripts=(.devcontainer/dev-tools/*.sh .claude/hooks/session-start.sh)
          shellcheck -x "${scripts[@]}"
          shfmt -i 4 -ci -d "${scripts[@]}"
